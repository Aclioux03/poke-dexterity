spring.application.name=poke-dexterity

# Lee las credenciales desde el archivo .env local (si existe).
# Si no existe, se usan las variables de entorno del sistema con el mismo nombre.
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL: los valores salen de DB_URL, DB_USER y DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokedex}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones pequeño: es una app de demostración
spring.datasource.hikari.maximum-pool-size=5

# El esquema se crea con los scripts de sql/, no desde Spring
spring.sql.init.mode=never

# Thymeleaf: sin caché en desarrollo para ver los cambios al recargar
spring.thymeleaf.cache=false

server.port=8080
